name: Docker CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend unit tests
        run: python -m pytest tests -q --import-mode=importlib

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Typecheck and build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
      - name: Smoke test backend image imports
        run: |
          docker build -t job-send-backend:ci .
          docker run --rm job-send-backend:ci python -c "from app.api.main import app; assert app is not None"
      - name: Smoke test backend PDF compilation
        run: |
          docker run --rm job-send-backend:ci python -c "
          import tempfile
          from pathlib import Path
          from app.modules.resume_builder.latex import LatexRenderer, PdfLatexCompiler
          from app.modules.resume_builder.model import ProfessionalProfile, ProfileItem, ResumeDocument
          profile = ProfessionalProfile(
              name='Smoke Test Candidate',
              headline='Senior Backend Engineer',
              email='smoke@example.com',
              phone='+1-555-0100',
              links=['https://github.com/example'],
              skills=['Python', 'FastAPI', 'Docker'],
              experiences=[ProfileItem(title='Senior Engineer', subtitle='Tech Corp', date='2022 - Present', description='Scaled microservices', skills=['Python', 'Docker'])],
              projects=[ProfileItem(title='Crawler', description='Async crawler', skills=['Python', 'Asyncio'])],
              education=[ProfileItem(title='BS Computer Science', subtitle='State University', date='2018 - 2022')],
          )
          compiler = PdfLatexCompiler()
          with tempfile.TemporaryDirectory() as tmpdir:
              # 1. Test classic template
              doc_classic = ResumeDocument(company_name='Smoke Test Co', profile=profile, template='classic')
              source_classic = LatexRenderer().render(doc_classic)
              pdf_classic = compiler.compile(source_classic, Path(tmpdir) / 'classic')
              assert len(pdf_classic) > 1000, f'Classic PDF compilation failed: size {len(pdf_classic)}'

              # 2. Test JVS template
              doc_jvs = ResumeDocument(company_name='Smoke Test Co', profile=profile, template='jvs')
              source_jvs = LatexRenderer().render(doc_jvs)
              pdf_jvs = compiler.compile(source_jvs, Path(tmpdir) / 'jvs')
              assert len(pdf_jvs) > 1000, f'JVS PDF compilation failed: size {len(pdf_jvs)}'

          print('Smoke test passed: Both classic and JVS LaTeX templates compiled to valid PDFs.')
          "
      - name: Smoke test LLM-selected company PDFs (offline fixture)
        run: |
          docker run --rm job-send-backend:ci python -c "
          import json
          import tempfile
          from pathlib import Path
          from app.modules.llm.interface import LLMResponse
          from app.modules.resume_builder.company_batch import CompanyResumeBatch
          class StubLLM:
              def generate(self, request):
                  marker = 'Select company-relevant resume evidence from the JSON below.\n'
                  evidence = json.loads(request.messages[1].content.split(marker, 1)[1].split('\n\nOutput schema:', 1)[0])
                  project = evidence['eligible_projects'][0]
                  selected = {'projects': [{'item_id': project['id'], 'score': 0.9, 'reason': 'Matches role'}],
                              'experiences': [], 'skills': project['skills'][:1]}
                  return LLMResponse(content=json.dumps(selected), provider='ci-fixture', model='ci-fixture')
          resume = {'candidate_name': 'Test Candidate', 'skills': ['Python', 'PyTorch'],
                    'links': {'emails': ['test@example.com']}, 'education': ['BTech Computer Science']}
          github = {'projects': [
              {'repo_name': 'APIApp', 'summary': 'FastAPI services',
               'tech_stack': {'backend': ['FastAPI'], 'frontend': [], 'ai_ml': []}},
              {'repo_name': 'MLApp', 'summary': 'PyTorch image model',
               'tech_stack': {'backend': [], 'frontend': [], 'ai_ml': ['PyTorch']}},
          ]}
          companies = [{'company_name': 'Backend Co', 'role': 'Backend Engineer'},
                       {'company_name': 'Vision Co', 'role': 'ML Engineer'}]
          matches = {'Backend Co': [{'project_name': 'APIApp'}],
                     'Vision Co': [{'project_name': 'MLApp'}]}
          with tempfile.TemporaryDirectory() as root:
              batch = CompanyResumeBatch(Path(root), llm_router=StubLLM())
              entries = batch.generate(resume=resume, github=github, companies=companies, matches=matches)
              assert len(entries) == 2
              sources = []
              for entry in entries.values():
                  assert entry['llm_provider'] == 'ci-fixture'
                  document = batch.service.get_document(entry['document_id'])
                  sources.append(batch.service.latex(document))
                  pdf = batch.service.pdf(document)
                  assert pdf.startswith(b'%PDF-') and len(pdf) > 1000
              assert 'APIApp' in sources[0] and 'MLApp' not in sources[0]
              assert 'MLApp' in sources[1] and 'APIApp' not in sources[1]
          print('Two independently selected company PDFs compiled successfully.')
          "
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
