name: Feature request
description: Propose an improvement to Job Send Crawl
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
      placeholder: Describe the user or contributor pain point before describing the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / portal
        - FastAPI / backend
        - Pipeline
        - Resume parsing
        - GitHub parsing
        - Company imports
        - Matching / ranking
        - Neo4j / graph
        - Qdrant / vector search
        - Draft generation
        - Mail / queue
        - Docker / setup
        - Documentation
        - Contributor experience
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or implementation notes. Do not include secrets or personal data.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests for duplicates.
          required: true
        - label: I am willing to help implement or test this improvement.
          required: false
